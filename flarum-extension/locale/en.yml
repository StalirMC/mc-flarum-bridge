    settings:
      title: MC Bridge
      locale_label: Output language
      locale_help: Language used by the console commands and API errors.
      secret_label: Shared secret
      secret_help: The HMAC secret shared with your Minecraft servers. Generate one with "php flarum mc-bridge:secret".
      tags_label: Announcement tags
      tags_help: Only discussions carrying one of these tags are pushed to the game. Leave empty to push every new discussion.
