# English
#
# The namespace is the extension ID (derived from the composer package name
# stalir/mc-bridge), so keys are used as:
#   $messages->get('console.secret.stored')  ->  stalir-mc-bridge.console.secret.stored
stalir-mc-bridge:
  console:
    secret:
      missing: "No secret is configured yet."
      too_short: "The secret must be at least 32 characters long."
      stored: "MC Bridge secret stored."
      paste_intro: "Put this value in the plugin config.yml:"
      paste_line: "  security.secret: {secret}"
      replaced: "Note: the previous secret was replaced. Update your servers."
    config:
      title: "MC Bridge settings"
      nothing_changed: "Nothing changed. Available options: --tags, --sync-replies, --locale, --max-age-days."
      updated: "{count} setting(s) updated."
      note: "New discussions are matched from now on; already queued messages are unaffected."
      tags_cleared: "Announcement tags cleared - every new discussion will be pushed."
      tags_set: "Announcement tags set to {tags}"
      invalid_tags: "Not a tag ID: {tags}"
      tag_hint: 'Tag IDs are integers. List them in php flarum tinker with \Flarum\Tags\Tag::pluck("id","name").'
      sync_replies_on: "Reply syncing enabled"
      sync_replies_off: "Reply syncing disabled"
      retention: "Retention window set to {days} day(s)"
      locale_set: "Output language set to {locale}"
      unknown_locale: "Unsupported language: {locale}. Available: {available}"
      must_be_boolean: "--sync-replies must be 0 or 1."
      must_be_non_negative: "--max-age-days must be a non-negative integer."
      label_secret: "Shared secret"
      label_tags: "Announcement tags"
      label_sync_replies: "Sync replies"
      label_retention: "Retention"
      label_locale: "Output language"
      value_secret_set: "configured ({length} chars)"
      value_secret_unset: "not set"
      value_tags_all: "all discussions"
      value_retention: "{days} day(s)"
      value_yes: "yes"
      value_no: "no"
    selftest:
      title: "MC Bridge self test"
      live_skipped: "Live HTTP check skipped. Re-run with:"
      live_hint: "  php flarum mc-bridge:selftest --url=https://your.forum"
      all_passed: "All bridge checks passed."
      next_step: "Next: start the Minecraft server and watch for a successful heartbeat."
      failed: "{count} check(s) failed."
      troubleshoot: "See docs/README.md section 6 (troubleshooting)."
      mark_ok: "  OK  "
      mark_fail: " FAIL "
      mark_note: " NOTE "
      check:
        secret_title: "Shared secret"
        secret_missing: "not configured - run: php flarum mc-bridge:secret"
        secret_short: "shorter than 32 characters; rotate it with mc-bridge:secret"
        secret_ok: "configured ({length} characters)"
        crypto_title: "HMAC signature"
        crypto_skipped: "skipped because no secret is configured"
        crypto_verify_failed: "a signature produced by BridgeCrypto did not verify"
        crypto_tamper_failed: "a modified body still verified - do not use this build"
        crypto_separation_failed: "a different secret also verified the signature"
        crypto_ok: "sign/verify ok, tampering rejected"
        canonical_title: "Canonical string"
        canonical_bad: "unexpected format; the plugin will not be able to authenticate"
        canonical_ok: 'timestamp\nnonce\nMETHOD\npath\nbody'
        path_title: "Path normalisation"
        path_bad: "normalizePath({input}) returned {actual}, expected {expected}"
        path_ok: "sub-directory installs and query strings handled"
        tables_title: "Database tables"
        tables_missing: "missing: {tables} - run: php flarum migrate"
        tables_ok: "{count} tables present"
        queries_title: "Query paths"
        queries_failed: "{message}"
        queries_ok: "{pending} pending outbox message(s), {servers} known server(s)"
        bind_title: "Binding code format"
        bind_bad: 'generated code "{code}" is not 8 unambiguous characters'
        bind_ok: "200 samples, 8 chars, no 0/O/1/I"
        live_title: "Live loopback"
        live_skipped_no_secret: "skipped because no secret is configured"
        live_no_guzzle: "Guzzle is not available in this installation"
        live_http_error: "POST {path} returned HTTP {status}: {body}"
        live_not_ok: "the endpoint answered but did not report ok=true"
        live_ok: "signed heartbeat accepted by the web server"
        probe_cleanup: "Probe cleanup"
        probe_cleanup_ok: "temporary selftest server row removed"
        probe_cleanup_failed: "could not remove the selftest row: {message}"
  api:
    error:
      secret_missing: "The MC Bridge secret is not configured on this forum. Run \"php flarum mc-bridge:secret\" first."
      auth_headers_missing: "Missing bridge authentication headers."
