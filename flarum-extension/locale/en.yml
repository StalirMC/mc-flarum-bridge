        secret_ok: "configured ({length} characters)"
        crypto_title: "HMAC signature"
        crypto_skipped: "skipped because no secret is configured"
        crypto_verify_failed: "a signature produced by BridgeCrypto did not verify"
        crypto_tamper_failed: "a modified body still verified - do not use this build"
        crypto_separation_failed: "a different secret also verified the signature"
        crypto_ok: "sign/verify ok, tampering rejected"
        canonical_title: "Canonical string"
        canonical_bad: "unexpected format; the plugin will not be able to authenticate"
        canonical_ok: 'timestamp\nnonce\nMETHOD\npath\nbody'
