# Plain key/value properties only - this file is NOT evaluated as Groovy.
#
# Project version. It is injected into plugin.yml by Gradle and has to match
# Version.VERSION in src/main/java/cn/stalir/mcbridge/Version.java, which the
# HTTP User-Agent uses; tools/verify.mjs enforces that, and the release workflow
# rejects a tag that disagrees with it.
version=0.0.20

# Paper API used to compile the Paper/Folia module. It also provides the Folia
# scheduler API (io.papermc.paper.threadedregions.scheduler), so no separate
# folia-api dependency is needed. Override on the command line with:
#   gradlew build -PpaperApiVersion=1.21.4-R0.1-SNAPSHOT
paperApiVersion=1.21.1-R0.1-SNAPSHOT

# NeoForge for Minecraft 1.21.1. The 21.1.x line is the one that targets 1.21.1;
# the neoforge/ project compiles against it through ModDevGradle, which pulls the
# matching Minecraft and mappings itself.
neoforgeVersion=21.1.100
modDevGradleVersion=2.0.147

# PlaceholderAPI, compiled against for the optional hook in the Paper/Folia
# module only (see paper/PlaceholderApiHook). The plugin is never bundled and
# never required: without it, %placeholders% are left exactly as written.
placeholderApiVersion=2.11.6

# Adventure, used by the Paper/Folia module only. Paper ships it; Minecraft
# 1.21.1 does not, which is why the shared core renders cn.stalir.mcbridge.Message
# instead and each platform converts that to its own component type.
adventureApiVersion=4.14.0

# Gson: shipped by Paper/Folia and by Minecraft alike, so compile-only.
gsonVersion=2.10.1
