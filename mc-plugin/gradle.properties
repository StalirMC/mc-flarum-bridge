# Plain key/value properties only - this file is NOT evaluated as Groovy.
#
# Project version. It is injected into plugin.yml by Gradle and has to match
# Version.VERSION in src/main/java/cn/stalir/mcbridge/Version.java, which the
# Velocity annotation and the HTTP User-Agent use; tools/verify.mjs enforces that.
version=0.0.15

# Paper API used to compile the Paper/Folia module. It also provides the Folia
# scheduler API (io.papermc.paper.threadedregions.scheduler), so no separate
# folia-api dependency is needed. Override on the command line with:
#   gradlew build -PpaperApiVersion=1.21.4-R0.1-SNAPSHOT
paperApiVersion=1.21.1-R0.1-SNAPSHOT

# Velocity API. Only SNAPSHOT builds are published; the annotation processor
# bundled with it generates velocity-plugin.json from the @Plugin annotation.
velocityApiVersion=3.4.0-SNAPSHOT

# Adventure and Gson are provided by Paper, Folia and Velocity alike, so they are
# compile-only. The versions are deliberately conservative: the shared core only
# uses API that has been stable for years, and compiling against an older version
# than the runtime ships is always safe.
adventureApiVersion=4.14.0
gsonVersion=2.10.1
