name: McBridge
version: '${version}'
main: cn.stalir.mcbridge.paper.McBridgePlugin
api-version: '1.21'
authors: [StalirMC]
description: Reports server status to Flarum and relays forum announcements back into the game.
website: https://forum.kxkl2024.cn
folia-supported: true

commands:
  bind:
    description: Link your Minecraft account to your Flarum account
    usage: /bind
    permission: mcbridge.bind
  mcbridge:
    description: McBridge administration
    usage: /mcbridge <news|outbox|broadcast|stats|reload>
    aliases: [mcb]
  report:
    description: Report a player to the forum moderators
    usage: /report <player> <reason>
    permission: mcbridge.report

permissions:
  mcbridge.bind:
    description: Allows a player to request an account binding code
    default: true
  mcbridge.report:
    description: Allows a player to report another player
    default: true
  mcbridge.admin:
    description: Allows managing the bridge and sending broadcasts
    default: op
