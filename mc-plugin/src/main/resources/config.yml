# ---------------------------------------------------------------------------
# McBridge configuration
#
# After editing this file run: /mcbridge reload
# ---------------------------------------------------------------------------

forum:
  # Base URL of your Flarum installation, WITHOUT a trailing slash.
  # Include the sub-directory if Flarum is not served from the domain root.
  url: "https://forum.kxkl2024.cn"
  # Path prefix of the bridge API. Only change this if you changed it in the
  # Flarum extension as well.
  api-prefix: "/api/mc-bridge"
  request-timeout-seconds: 10

server:
  # Identifies this server on the forum. Allowed: A-Z a-z 0-9 . _ -
  key: "survival"
  # Friendly name shown on the forum.
  name: "Stalir 生存服"

security:
  # Shared HMAC secret. Generate it on the forum with:
  #   php flarum mc-bridge:secret
  # and paste the printed value here. It must be at least 32 characters.
  secret: ""

sync:
  heartbeat-interval-seconds: 30
  outbox-poll-interval-seconds: 20
  event-flush-interval-seconds: 10
  # Events are buffered while the forum is unreachable; oldest are dropped
  # once this limit is reached.
  max-queued-events: 200
  report-joins: true
  report-quits: true
  report-deaths: true
  report-advancements: false

game:
  # Placeholders: {title} {body} {url} {type}
  announce-format: "&e[论坛] &f{title}"
  # Show the body on a second line when it is present.
  announce-body-format: "&7{body}"
  # Whether the plugin may execute commands pushed from the forum.
  # Keep this disabled unless you are deliberately using Flarum as a remote
  # console: anyone who obtains the secret can then run these commands.
  allow-remote-commands: false
  # Java regular expressions; only matching commands are executed.
  remote-command-whitelist:
    - "^broadcast .+"
    - "^say .+"

messages:
  prefix: "&8[&2MCBridge&8] &r"
  no-permission: "&c你没有权限执行此命令。"
  players-only: "&c该命令只能由玩家执行。"
  bind-requesting: "&7正在向论坛申请绑定码…"
  bind-code: "&a绑定码 &e{code} &a，有效期 &e{minutes} &a分钟。"
  bind-hint: "&7请前往论坛 → 个人设置 → 输入该绑定码完成绑定。"
  bind-already: "&a你的账号已绑定论坛用户 &e{user}&a。"
  bind-failed: "&c获取绑定码失败：{reason}"
  status-online: "&a在线服务器 &e{servers_online}&a/&e{servers}&a，玩家 &e{players}&a。"
  status-unreachable: "&c无法连接论坛：{reason}"
  outbox-empty: "&7论坛没有待投递的消息。"
  outbox-header: "&7待投递消息 &e{count} &7条："
  outbox-line: "&8- &f{type} &7{title}"
  broadcast-sent: "&a消息已提交到论坛，将在服务器轮询后显示。"
  reloaded: "&a配置已重新加载。"
