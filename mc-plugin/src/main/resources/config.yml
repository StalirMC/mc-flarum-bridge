# ---------------------------------------------------------------------------
# McBridge configuration
#
# After editing this file run: /mcbridge reload
#
# Messages are NOT in this file. They live in lang/<language>.yml (player
# messages and plugin log lines). Shipped languages: zh_CN (default), en.
# ---------------------------------------------------------------------------

# Output language: zh_CN (default) or en. Drop another file into
# plugins/McBridge/lang/ to add a language.
language: zh_CN

forum:
  # Base URL of your Flarum installation, WITHOUT a trailing slash.
  # Include the sub-directory if Flarum is not served from the domain root.
  url: "https://forum.kxkl2024.cn"
  # Path prefix of the bridge API. Only change this if you changed it in the
  # Flarum extension as well.
  api-prefix: "/api/mc-bridge"
  request-timeout-seconds: 10

server:
  # Identifies this server on the forum. Allowed: A-Z a-z 0-9 . _ -
  key: "survival"
  # Friendly name shown on the forum.
  name: "Stalir 生存服"

security:
  # Shared HMAC secret. Generate it on the forum with:
  #   php flarum mc-bridge:secret
  # and paste the printed value here. It must be at least 32 characters.
  secret: ""

sync:
  # How often the plugin asks the forum for pending announcements.
  outbox-poll-interval-seconds: 20

game:
  # Placeholders: {title} {body} {url} {type}
  announce-format: "&e[论坛] &f{title}"
  # Show the body on a second line when it is present. On the title channel this
  # same value is used as the subtitle.
  announce-body-format: "&7{body}"
  # How an announcement is presented. Any combination, comma separated:
  #   chat       a normal chat line (the default)
  #   actionbar  the line just above the hotbar
  #   title      a large centred title
  #   bossbar    a bar across the top of the screen
  # Example - show it in chat and as a boss bar at the same time:
  #   announce-display: "chat,bossbar"
  #
  # Only the chat line carries the body and the link in full; the other channels
  # show the headline, and the title additionally uses the body as its subtitle.
  announce-display: "chat"
  # How long a title and a boss bar stay on screen.
  title-seconds: 5
  bossbar-seconds: 10
  # Tell a player who has not linked a forum account how to do it when they join.
  prompt-unbound: true

report:
  # Title of the discussion that /report creates on the forum.
  #
  # Two kinds of placeholder:
  #   {target} {reporter} {reason} {server}  filled in by this plugin
  #   %...%                                  PlaceholderAPI, if that plugin and
  #                                          the matching expansion are
  #                                          installed; otherwise left as typed
  #
  # Leave empty to let the forum render the title itself
  # (php flarum mc-bridge:config --report-title).
  title-format: "[举报] {target}（由 {reporter} 提交）"

  # Which forum tags the report discussion is filed under, comma separated; each
  # entry is a slug ("reports") or a numeric tag id. Example:
  #   tags: "reports,pending"
  #
  # flarum/tags limits how many primary/secondary tags a discussion may carry
  # (Admin -> Tags -> Settings). The report author needs the "bypassTagCounts"
  # permission if the list exceeds those limits.
  #
  # Empty = use the forum's own setting
  # (php flarum mc-bridge:config --report-tags).
  tags: ""

  # Which forum account the report is published as: a username or a numeric user
  # id. Empty = use the forum's own setting
  # (php flarum mc-bridge:config --report-actor).
  actor: ""

  # How many of the reported player's OWN recent public chat lines to attach to
  # the report, so a moderator can see what was actually said rather than only
  # the reporter's summary. 0 disables it.
  #
  # Only public chat is ever captured: private messages (/msg) and commands
  # (/...) are never recorded. The buffer holds at most this many lines per
  # player, the transcript is attached only when that player is reported, and it
  # is never broadcast into chat.
  chat-context-lines: 10
