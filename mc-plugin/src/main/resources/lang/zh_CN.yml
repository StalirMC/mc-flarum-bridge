# 简体中文（默认语言）
#
# 玩家可见的消息与插件日志都在这里。占位符用花括号，例如 {code}。
# 想改文案直接编辑本文件，或在 lang/ 下新增语言文件并在 config.yml 里切换。

prefix: "&8[&2MCBridge&8] &r"

# ---- 权限与用法 ----
no-permission: "&c你没有权限执行此命令。"
players-only: "&c该命令只能由玩家执行。"
unknown-subcommand: "&c未知子命令。可用：&f{available}"
help-header: "&8&m--------&r &2McBridge &8&m--------"
help-outbox: "&7/mcbridge outbox &8- &f查看待投递的消息"
help-broadcast: "&7/mcbridge broadcast <内容> &8- &f向所有服务器推送一条消息"
help-stats: "&7/mcbridge stats &8- &f本地统计"
help-reload: "&7/mcbridge reload &8- &f重新加载配置"

# ---- 账号绑定 ----
bind-requesting: "&7正在向论坛申请绑定码…"
bind-code: "&a绑定码 &e{code} &a，有效期 &e{minutes} &a分钟。"
bind-hint: "&7请到论坛右上角点击头像 → &e设置&7，往下翻找到 &eMinecraft 账号&7，把上面的绑定码填进去即可。"
bind-already: "&a你的账号已绑定论坛用户 &e{user}&a。"
bind-prompt: "&7你还没有绑定论坛账号。输入 &e/bind &7获取绑定码，再到论坛右上角点开头像 → &e设置&7，往下翻填入绑定码。"
bind-prompt-code: "&7你的绑定码是 &e{code} &7，请到论坛右上角头像 → &e设置&7 里填入完成绑定。"
bind-failed: "&c获取绑定码失败：{reason}"
bind-failed-no-code: "&c论坛没有返回绑定码。"

# ---- 状态与公告 ----
status-unreachable: "&c无法连接论坛：{reason}"
outbox-empty: "&7论坛没有待投递的消息。"
outbox-header: "&7待投递消息 &e{count} &7条："
outbox-line: "&8- &f{type} &7{title}"
outbox-untitled: "（无标题）"
broadcast-usage: "&c用法：/mcbridge broadcast <内容>"
broadcast-sent: "&a消息已提交到论坛，将在服务器轮询后显示。"

# ---- 重载与统计 ----
reloaded: "&a配置已重新加载。"
reload-problems: "&c配置仍有问题：&7{problems}"
stats-header: "&8&m--------&r &2McBridge &8&m--------"
stats-platform: "&7运行平台：&f{platform}"
stats-server-key: "&7服务器标识：&f{key}"
stats-forum-url: "&7论坛地址：&f{url}"
stats-locale: "&7输出语言：&f{locale}"
stats-received: "&7已接收消息：&f{received}"
stats-config: "&7配置状态：{state}"
stats-config-ok: "&a正常"
stats-config-bad: "&c有问题"

# ---- 控制台日志 ----
log:
  enabled: "McBridge 已启用（平台 {platform}）：服务器标识 '{key}'，目标 {url}"
  disabled: "McBridge 已关闭。"
  idle: "配置存在问题，McBridge 暂不工作，请先按上面的提示修复。"
  outbox-failed: "拉取公告失败（连续 {count} 次）：{reason}"
  relayed: "已投递来自论坛的 {type}：{title}"
  outbox-handle-failed: "处理公告消息时出错"
  bind-feedback-sent: "已向玩家 {uuid} 发送绑定反馈（{type}）"
  bind-feedback-uuid-invalid: "绑定反馈的 UUID 无效：{uuid}"
  bind-feedback-no-uuid: "绑定反馈消息缺少 target_uuid（{type}）"

# ---- 配置校验提示 ----
config:
  problem:
    url-empty: "forum.url 未填写"
    url-scheme: "forum.url 必须以 http:// 或 https:// 开头"
    server-key: "server.key 必须匹配 [A-Za-z0-9._-] 且长度为 1-100"
    secret-empty: "security.secret 未填写 —— 请先在论坛执行 php flarum mc-bridge:secret，把结果填进来"
    secret-short: "security.secret 长度不足 32 个字符"
    summary: "配置问题：{message}"
