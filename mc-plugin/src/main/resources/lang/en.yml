# English
#
# Player-facing messages and plugin log lines. Placeholders use braces, e.g. {code}.
# Edit this file to customise the wording, or add another language file under
# lang/ and select it with `language` in config.yml.

prefix: "&8[&2MCBridge&8] &r"

# ---- permissions and usage ----
no-permission: "&cYou do not have permission to run this command."
players-only: "&cThis command can only be run by a player."
unknown-subcommand: "&cUnknown subcommand. Available: &f{available}"
help-header: "&8&m--------&r &2McBridge &8&m--------"
help-news: "&7/mcbridge news &8- &fShow the latest forum announcements"
help-outbox: "&7/mcbridge outbox &8- &fList messages waiting to be delivered"
help-broadcast: "&7/mcbridge broadcast <text> &8- &fPush a message to every server"
help-stats: "&7/mcbridge stats &8- &fLocal counters"
help-reload: "&7/mcbridge reload &8- &fReload the configuration"

# ---- account binding ----
bind-requesting: "&7Requesting a binding code from the forum..."
bind-code: "&aBinding code &e{code} &a- valid for &e{minutes} &aminutes."
bind-hint: "&7Open the forum, click your avatar in the top right → &eSettings&7, scroll down to &eMinecraft account&7 and enter the code above."
bind-already: "&aYour account is already linked to the forum user &e{user}&a."
bind-prompt: "&7Your forum account is not linked yet. Type &e/bind &7for a code, then click your avatar in the forum's top right → &eSettings&7 and enter it there."
bind-prompt-code: "&7Your binding code is &e{code} &7- enter it under your avatar → &eSettings&7 to finish linking."
bind-failed: "&cCould not obtain a binding code: {reason}"
bind-failed-no-code: "&cThe forum did not return a binding code."

# ---- player reporting ----
report-usage: "&cUsage: /report <player> <reason>&7, or &c/report status&7 to see what happened to your own reports."
report-sent: "&aReported player &e{target}&a. Forum moderators will review it soon."
report-failed: "&cCould not submit the report: {reason}"
report-uncertain: "&eThe forum did not answer in time, so the report &fmay already have been filed&e. &7Please do not report again yet. &8({reason})"
report-status-header: "&8&m--------&r &eMy reports &8&m-------- &7(last {count})"
report-status-line: "&8#&f{id} &7to &f{target} &8- {status} &8- &7{date}"
report-status-empty: "&7You have not filed any reports."
report-status-pending: "&epending"
report-status-resolved: "&ahandled"
report-status-rejected: "&crejected"
report-status-unknown: "&7unknown"
notice-report-resolved: "&aYour report was handled: &e{target}"
notice-report-rejected: "&cYour report was rejected: &e{target}"
notice-report-note: "&7Moderator note: &f{note}"

# ---- status and announcements ----
status-unreachable: "&cCannot reach the forum: {reason}"
outbox-empty: "&7There are no messages waiting on the forum."
outbox-header: "&7Waiting messages: &e{count}"
outbox-line: "&8- &f{type} &7{title}"
outbox-untitled: "(untitled)"
news-empty: "&7There are no recent announcements on the forum."
news-header: "&8&m--------&r &eForum Announcements &8&m-------- &7(last {count})"
broadcast-usage: "&cUsage: /mcbridge broadcast <text>"
broadcast-sent: "&aMessage queued on the forum; it will appear after the next poll."

# ---- reload and statistics ----
reloaded: "&aConfiguration reloaded."
reload-problems: "&cThe configuration still has problems: &7{problems}"
stats-header: "&8&m--------&r &2McBridge &8&m--------"
stats-platform: "&7Platform: &f{platform}"
stats-server-key: "&7Server key: &f{key}"
stats-forum-url: "&7Forum URL: &f{url}"
stats-locale: "&7Language: &f{locale}"
stats-received: "&7Received messages: &f{received}"
stats-config: "&7Configuration: {state}"
stats-config-ok: "&aok"
stats-config-bad: "&cproblems"

# ---- console log ----
log:
  enabled: "McBridge enabled on {platform} as server '{key}' -> {url}"
  disabled: "McBridge disabled."
  idle: "The configuration has problems, so McBridge stays idle until they are fixed."
  outbox-failed: "Outbox poll failed ({count} in a row): {reason}"
  relayed: "Relayed {type} from the forum: {title}"
  outbox-handle-failed: "Failed to handle an outbox message"
  bind-feedback-sent: "Sent binding feedback to player {uuid} ({type})"
  bind-feedback-uuid-invalid: "Invalid UUID in binding feedback: {uuid}"
  bind-feedback-no-uuid: "Binding feedback message missing target_uuid ({type})"
  report-outcome-sent: "Sent the outcome of a report to {uuid} ({type})"
  report-outcome-no-uuid: "Report outcome message missing target_uuid ({type})"
  report-outcome-uuid-invalid: "Invalid UUID in a report outcome: {uuid}"

# ---- configuration validation ----
config:
  problem:
    url-empty: "forum.url is empty"
    url-scheme: "forum.url must start with http:// or https://"
    server-key: "server.key must match [A-Za-z0-9._-] and be 1-100 characters long"
    secret-empty: "security.secret is empty - run \"php flarum mc-bridge:secret\" and paste the value"
    secret-short: "security.secret must be at least 32 characters long"
    summary: "Configuration problem: {message}"
  warn:
    display-unknown: "game.announce-display has an unrecognised value \"{value}\", which was skipped (valid: chat / actionbar / title / bossbar)"
