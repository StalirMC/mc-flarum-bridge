# Gradle wrapper metadata.
#
# The wrapper JAR and scripts are generated locally so that this repository
# stays free of binaries:
#
#   cd mc-plugin
#   gradle wrapper --gradle-version 8.10
#
# After that `./gradlew build` (or `gradlew.bat build` on Windows) works
# without a system Gradle installation. CI does not need the wrapper because it
# installs Gradle explicitly.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
