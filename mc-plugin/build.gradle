plugins {
    id 'java'
}

group = 'cn.stalir'
description = 'Bidirectional bridge between Minecraft (Paper, Folia, NeoForge) and a Flarum forum'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    // PlaceholderAPI is an optional Paper/Folia plugin: it is compiled against
    // so the hook is type checked, never bundled and never required at runtime.
    maven {
        name = 'placeholderapi'
        url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/')
    }
}

// ---------------------------------------------------------------------------
// Paper/Folia plugin: the shared core plus the Bukkit entry points
//
//   main   platform independent core: protocol, config, language files and the
//          heartbeat/outbox orchestration. Compiled against the JDK and Gson
//          only - not even Adventure, because Minecraft 1.21.1 (and therefore
//          NeoForge) does not ship it. The core stops at cn.stalir.mcbridge
//          .Message and each platform renders that itself.
//   paper  the Paper and Folia entry points (paper-api).
//
// The NeoForge mod is a project of its own (see neoforge/): ModDevGradle has to
// own the Minecraft dependency of the project it is applied to, and keeping it
// separate is what guarantees Minecraft never reaches the core's classpath.
// ---------------------------------------------------------------------------

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }

    paper {
        java.srcDirs = ['src/paper/java']
        resources.srcDirs = ['src/paper/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    // Provided by the server at runtime, so never bundled.
    compileOnly "com.google.code.gson:gson:${gsonVersion}"

    paperCompileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    // Adventure belongs to the paper module alone: Paper ships it, NeoForge does
    // not, and the shared core is deliberately free of it.
    paperCompileOnly "net.kyori:adventure-api:${adventureApiVersion}"
    paperCompileOnly "net.kyori:adventure-text-serializer-legacy:${adventureApiVersion}"
    // The chat listener turns a delivered message back into plain text for the
    // transcript a report can carry.
    paperCompileOnly "net.kyori:adventure-text-serializer-plain:${adventureApiVersion}"
    // Only the paper module may touch this either; a mod loader has no
    // PlaceholderAPI.
    paperCompileOnly "me.clip:placeholderapi:${placeholderApiVersion}"

    // Only the runtime self test needs Gson on the classpath at run time.
    testImplementation "com.google.code.gson:gson:${gsonVersion}"
}

// ---------------------------------------------------------------------------
// Compilation
//
// The toolchain is JDK 21 and the bytecode target differs per module:
//
//   main / test   Java 17
//   paper         Java 21
//
// Staying on 17 for the shared core means it keeps loading on the widest range
// of JVMs; one jar may mix class file versions, since each class declares its
// own and the JVM loads whatever version it supports.
// ---------------------------------------------------------------------------

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

// paper-api 1.21.1 is itself compiled for Java 21, and Gradle refuses to resolve
// it for a Java 17 target. Paper and Folia 1.21 require Java 21 at runtime
// anyway, so only this module is raised.
tasks.named('compilePaperJava') {
    options.release = 21
}

// config.yml and lang/*.yml are copied verbatim: they contain {placeholders},
// not Gradle templates.
processResources {
    filteringCharset = 'UTF-8'
}

// plugin.yml is the only filtered resource: ${version} becomes the project
// version and the result has to sit at the jar root.
processPaperResources {
    filteringCharset = 'UTF-8'

    // expand() runs as a task action, so Gradle does not treat the expansion
    // value as an input by itself. Without this line a version bump leaves the
    // previously expanded plugin.yml in build/resources/paper, the task stays
    // UP-TO-DATE and the jar ships the old version - which verifyJar then
    // rejects, but only after a confusing failure.
    inputs.property('version', project.version)

    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

// ---------------------------------------------------------------------------
// Packaging
// ---------------------------------------------------------------------------

tasks.named('jar') {
    archiveBaseName = 'McBridge'

    from sourceSets.paper.output

    manifest {
        attributes(
                'Implementation-Title': 'McBridge',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Stalir'
        )
    }
}

// ---------------------------------------------------------------------------
// Runtime self test
//
// Compilation cannot prove the hand written YAML reader, the language pipeline
// or the configuration validation are correct, and the static checks in
// tools/verify.mjs never execute Java. CI has a JDK, so this runs the shared core
// against the exact files that ship inside the jar.
// ---------------------------------------------------------------------------

tasks.register('selfTest', JavaExec) {
    description = 'Runs the shared core against the shipped config.yml and language files.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.stalir.mcbridge.SelfTest'
    workingDir = projectDir
}

tasks.named('check') {
    dependsOn tasks.named('selfTest')
}

// ---------------------------------------------------------------------------
// Jar content assertions
//
// A plugin jar fails in a way that is easy to miss: the file builds, but the
// server silently cannot load it because a descriptor, an entry point or a
// language file is absent. Failing the build is far better than shipping that.
// ---------------------------------------------------------------------------

tasks.register('verifyJar') {
    description = 'Assert that the built jar is loadable by Paper and Folia.'
    group = 'verification'
    dependsOn tasks.named('jar')

    def jarTask = tasks.named('jar')
    def expectedVersion = project.version.toString()

    doLast {
        def jarFile = jarTask.get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)

        try {
            def entries = zip.entries().collect { it.name } as Set

            def required = [
                    'plugin.yml',
                    'config.yml',
                    'lang/zh_CN.yml',
                    'lang/en.yml',
                    'cn/stalir/mcbridge/BridgeCore.class',
                    'cn/stalir/mcbridge/Message.class',
                    'cn/stalir/mcbridge/paper/McBridgePlugin.class',
                    'cn/stalir/mcbridge/paper/PaperPlatform.class',
                    'cn/stalir/mcbridge/paper/AdventureMessages.class',
            ]

            def missing = required.findAll { !entries.contains(it) }

            if (!missing.isEmpty()) {
                throw new GradleException("The jar cannot serve Paper/Folia; missing entries: ${missing}")
            }

            // The Velocity descriptor and entry points are gone for good. A
            // leftover in the jar would mean the build still merges a module that
            // no longer exists.
            def stale = entries.findAll { it.contains('velocity') || it.contains('Velocity') }

            if (!stale.isEmpty()) {
                throw new GradleException("The jar still contains Velocity artifacts: ${stale}")
            }

            def readEntry = { String name ->
                zip.getInputStream(zip.getEntry(name)).getText('UTF-8')
            }

            def pluginYml = readEntry('plugin.yml')

            if (!pluginYml.contains('main: cn.stalir.mcbridge.paper.McBridgePlugin')) {
                throw new GradleException('plugin.yml does not point at the Paper entry point')
            }

            if (!pluginYml.contains('folia-supported: true')) {
                throw new GradleException('plugin.yml must declare folia-supported: true or Folia refuses to load the plugin')
            }

            if (!pluginYml.contains(expectedVersion)) {
                throw new GradleException("plugin.yml does not carry the project version ${expectedVersion}")
            }

            // The shared core must stay platform neutral. One Bukkit, Minecraft
            // or Adventure reference inside it would be resolved when a platform
            // that does not ship that library loads those classes, and would fail
            // there with NoClassDefFoundError. The string constant pool of the
            // class file is enough to catch that: javadoc never reaches it.
            def forbiddenInCore = ['org/bukkit/', 'io/papermc/', 'net/kyori/', 'net/minecraft/', 'net/neoforged/']

            zip.entries().findAll { entry ->
                entry.name.startsWith('cn/stalir/mcbridge/')
                        && entry.name.endsWith('.class')
                        && !entry.name.contains('/paper/')
                        && !entry.name.contains('/neoforge/')
            }.each { entry ->
                def pool = new String(zip.getInputStream(entry).readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)

                forbiddenInCore.each { forbidden ->
                    if (pool.contains(forbidden)) {
                        throw new GradleException(
                                "Shared class ${entry.name} references ${forbidden}, which not every platform ships")
                    }
                }
            }

            logger.lifecycle("verified ${jarFile.name}: ${entries.size()} entries, loadable by Paper and Folia")
        } finally {
            zip.close()
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyJar')
}
