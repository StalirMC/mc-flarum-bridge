name: CI

# Runs the checks that cannot be executed on a machine without a PHP and JDK
# toolchain: real PHP lint, real Java compilation, plus the toolchain-free
# static and protocol suites.
#
# IMPORTANT: the repository root must be the `mc-flarum-bridge` directory,
# because every path below is relative to it.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-protocol:
    name: Static consistency + protocol conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static consistency checks
        run: node tools/verify.mjs

      - name: Protocol conformance test (against the in-repo mock forum)
        run: node tools/protocol-test.mjs

  php:
    name: PHP lint + extension manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, pdo, pdo_mysql
          tools: composer:v2

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          find flarum-extension -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Validate composer.json
        working-directory: flarum-extension
        run: composer validate --no-check-lock --no-check-publish

      - name: Check the extension manifest is installable by Flarum
        run: |
          set -euo pipefail
          php -r '
            $path = "flarum-extension/composer.json";
            $manifest = json_decode(file_get_contents($path), true);
            if (! is_array($manifest)) { fwrite(STDERR, "composer.json is not valid JSON\n"); exit(1); }

            $fail = function (string $message) { fwrite(STDERR, $message . "\n"); exit(1); };

            if (($manifest["type"] ?? "") !== "flarum-extension") {
                $fail("type must be \"flarum-extension\"");
            }
            $require = $manifest["require"] ?? [];
            if (! isset($require["flarum/core"])) {
                $fail("require.flarum/core is missing");
            }
            if (($manifest["extra"]["flarum-extension"]["title"] ?? "") === "") {
                $fail("extra.flarum-extension.title is missing");
            }
            # Compare without embedding backslash literals: inside a YAML block
            # scalar the shell passes the text through verbatim, so a PHP
            # "\\\\" would become two real backslashes and never match.
            $psr4 = $manifest["autoload"]["psr-4"] ?? [];
            if (count($psr4) !== 1) {
                $fail("autoload psr-4 must contain exactly one mapping");
            }
            $prefix = array_key_first($psr4);
            if ($psr4[$prefix] !== "src/" || strpos($prefix, "Stalir") !== 0) {
                $fail("autoload psr-4 must map the Stalir namespace to src/, got: " . $prefix);
            }
            echo "extension manifest ok (requires flarum/core " . $require["flarum/core"] . ")\n";
          '

      - name: Verify the migration returns the Flarum 2.x closure array
        run: |
          set -euo pipefail
          php -r '
            $files = glob("flarum-extension/migrations/*.php");
            if ($files === []) { fwrite(STDERR, "no migration file found\n"); exit(1); }
            $migration = require $files[0];
            if (! is_array($migration)) {
                fwrite(STDERR, "the migration must RETURN an array (Flarum 2.x contract)\n"); exit(1);
            }
            foreach (["up", "down"] as $key) {
                if (! isset($migration[$key]) || ! is_callable($migration[$key])) {
                    fwrite(STDERR, "migration is missing a callable \"$key\" entry\n"); exit(1);
                }
            }
            $reflection = new ReflectionFunction($migration["up"]);
            $params = $reflection->getParameters();
            if ($params === [] || (string) $params[0]->getType() !== "Illuminate\\Database\\Schema\\Builder") {
                fwrite(STDERR, "the up closure must accept an Illuminate\\Database\\Schema\\Builder\n"); exit(1);
            }
            echo "migration contract ok\n";
          '

  java:
    name: Build the plugin with Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # A failed Gradle build is otherwise only readable from the raw job log,
      # which needs an authenticated API call. Publishing the compiler errors as
      # the check-run summary keeps them visible to anyone (and to tooling).
      - name: Build
        working-directory: mc-plugin
        run: |
          set -euo pipefail

          build() {
            if command -v gradle >/dev/null 2>&1; then
              gradle build --no-daemon --stacktrace
            else
              echo "::warning::gradle is not on PATH; bootstrapping the distribution manually"
              curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10-bin.zip
              unzip -q /tmp/gradle.zip -d /tmp
              /tmp/gradle-8.10/bin/gradle build --no-daemon --stacktrace
            fi
          }

          if build 2>&1 | tee build.log; then
            exit 0
          fi

          {
            echo '## Gradle build failed'
            echo
            echo '```'
            grep -nE 'error:|\.java:[0-9]+:|FAILURE:|What went wrong|Execution failed|Could not (resolve|find)|> Task .* FAILED' build.log | tail -n 150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::the Gradle build failed; the compiler errors are in the job summary"
          exit 1

      - name: Confirm the plugin jar was produced
        run: |
          set -euo pipefail
          ls -l mc-plugin/build/libs
          test -n "$(find mc-plugin/build/libs -name '*.jar' -print -quit)"

      # The Gradle build already asserts this in `verifyJar`; repeating it with
      # plain shell tools keeps the evidence visible in the CI log and catches
      # the case where that task is ever skipped.
      - name: Assert one jar serves Paper, Folia and Velocity
        run: |
          set -euo pipefail
          jar=$(find mc-plugin/build/libs -name '*.jar' ! -name '*-sources.jar' -print -quit)
          echo "inspecting $jar"
          unzip -l "$jar"

          for entry in plugin.yml velocity-plugin.json config.yml lang/zh_CN.yml lang/en.yml \
                       cn/stalir/mcbridge/paper/McBridgePlugin.class \
                       cn/stalir/mcbridge/velocity/McBridgeVelocityPlugin.class; do
            unzip -l "$jar" "$entry" > /dev/null || { echo "::error::missing $entry"; exit 1; }
          done

          unzip -p "$jar" plugin.yml | grep -q 'folia-supported: true' \
            || { echo "::error::plugin.yml must declare folia-supported: true"; exit 1; }
          unzip -p "$jar" plugin.yml | grep -q 'main: cn.stalir.mcbridge.paper.McBridgePlugin' \
            || { echo "::error::plugin.yml points at the wrong main class"; exit 1; }
          unzip -p "$jar" velocity-plugin.json | grep -q '"id": *"mc-bridge"' \
            || { echo "::error::velocity-plugin.json is missing the mc-bridge id"; exit 1; }

          echo "the jar declares both entry points"

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: McBridge-plugin
          path: mc-plugin/build/libs/*.jar
          if-no-files-found: error
