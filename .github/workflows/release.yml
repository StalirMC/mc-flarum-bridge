name: Release

# Publishing is driven by a tag, so the released artifacts are always the ones the
# CI workflow already validated for that exact commit:
#
#   git tag v0.0.1 && git push origin v0.0.1

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin jar and the mod jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # The tag and the version compiled into the jar have to agree, otherwise a
      # release would advertise a version the artifact does not contain.
      - name: Check the tag matches gradle.properties
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(grep -E '^version=' mc-plugin/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          expected="v${declared}"
          echo "tag=$TAG declared=$declared"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::tag $TAG does not match version $declared (expected $expected)"
            exit 1
          fi

      - name: Build
        working-directory: mc-plugin
        run: |
          set -euo pipefail
          if command -v gradle >/dev/null 2>&1; then
            gradle build --no-daemon --stacktrace
          else
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.10/bin/gradle build --no-daemon --stacktrace
          fi

      - name: Collect the jars
        run: |
          set -euo pipefail
          mkdir -p dist
          plugin=$(find mc-plugin/build/libs -name '*.jar' ! -name '*-sources.jar' -print -quit)
          mod=$(find mc-plugin/neoforge/build/libs -name '*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$plugin"
          test -n "$mod"
          cp "$plugin" "$mod" dist/
          ls -l dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: McBridge ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Two artifacts, one per loader family. Both carry the same shared core, so
            they behave identically; install the one your server can load.

            | File | Copy into | Runs on |
            |------|-----------|---------|
            | `McBridge-<version>.jar` | `plugins/` | Paper and Folia 1.21.x |
            | `McBridge-neoforge-<version>.jar` | `mods/` | NeoForge 21.1.x for Minecraft 1.21.1 (server side only - clients do not need it) |

            What both provide: forum announcements relayed into the game, `/bind` to
            link a Minecraft account to a Flarum account, `/report` to file a player
            report (which becomes a tagged discussion on the forum), and
            `/mcbridge news|outbox|broadcast|stats|reload`.

            On Paper and Folia, PlaceholderAPI is used when installed to expand
            `%placeholders%` in the report title.

            The Flarum extension is installed from this repository with Composer, so
            the tag also pins the matching extension revision.

            ```bash
            composer require stalirmc/mc-flarum-bridge
            ```

            Still work in progress: see the warning at the top of README.md.
          files: dist/*.jar
          fail_on_unmatched_files: true
